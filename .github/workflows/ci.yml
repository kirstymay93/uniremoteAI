name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build / Lint / Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Use a maintained Node LTS version. Adjust to 20/22/24 based on your app compatibility.
          node-version: '22'
          cache: 'npm'
          # ensure the cache keys are derived from the lockfiles present in the repo
          cache-dependency-path: '**/package-lock.json'

      - name: Show environment
        run: |
          node -v || true
          npm -v || true
          yarn -v 2>/dev/null || true
          pwd
          ls -la

      - name: Install dependencies (supports npm/yarn/pnpm)
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile found (package-lock.json) — running npm ci"
            npm ci --silent
          elif [ -f yarn.lock ]; then
            echo "Lockfile found (yarn.lock) — running yarn install"
            yarn install --frozen-lockfile --silent
          elif [ -f pnpm-lock.yaml ]; then
            echo "Lockfile found (pnpm-lock.yaml) — running pnpm install"
            pnpm install --frozen-lockfile --silent
          else
            echo "No lockfile found — running npm install (temporary fallback)"
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script — skipping"; fi

      - name: Test
        run: |
          if npm run | grep -q "test"; then npm test --if-present; else echo "No test script — skipping"; fi

      - name: Build
        run: |
          if npm run | grep -q "build"; then npm run build --if-present; else echo "No build script — skipping"; fi
