name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build / Lint / Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Use a maintained Node LTS version. Adjust to 20/22/24 based on your app compatibility.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            **/package-lock.json

      - name: Show environment
        run: |
          node -v || true
          npm -v || true
          yarn -v 2>/dev/null || true
          pwd
          ls -la

      - name: Detect lockfile
        id: detect-lock
        run: |
          if [ -f package-lock.json ]; then
            echo "found_lock=true" >> $GITHUB_OUTPUT
            echo "lock=package-lock.json" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "found_lock=true" >> $GITHUB_OUTPUT
            echo "lock=yarn.lock" >> $GITHUB_OUTPUT
          elif [ -f pnpm-lock.yaml ]; then
            echo "found_lock=true" >> $GITHUB_OUTPUT
            echo "lock=pnpm-lock.yaml" >> $GITHUB_OUTPUT
          else
            echo "found_lock=false" >> $GITHUB_OUTPUT
            echo "lock=none" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          echo "Lockfile detected: ${{ steps.detect-lock.outputs.lock }}"
          if [ "${{ steps.detect-lock.outputs.found_lock }}" = "true" ]; then
            if [ "${{ steps.detect-lock.outputs.lock }}" = "package-lock.json" ]; then
              echo "Using npm ci"
              npm ci --silent
            elif [ "${{ steps.detect-lock.outputs.lock }}" = "yarn.lock" ]; then
              echo "Using yarn install --frozen-lockfile"
              yarn install --frozen-lockfile --silent
            elif [ "${{ steps.detect-lock.outputs.lock }}" = "pnpm-lock.yaml" ]; then
              echo "Using pnpm install --frozen-lockfile"
              pnpm install --frozen-lockfile --silent
            else
              echo "Unknown lockfile type, falling back to npm install"
              npm install --no-audit --no-fund
            fi
          else
            echo "No lockfile found — running npm install (temporary fallback)"
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script — skipping"; fi

      - name: Test
        run: |
          if npm run | grep -q "test"; then npm test --if-present; else echo "No test script — skipping"; fi

      - name: Build
        run: |
          if npm run | grep -q "build"; then npm run build --if-present; else echo "No build script — skipping"; fi
